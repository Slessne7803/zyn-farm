<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zyn Farm Tracker</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #121212;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        /* --- THE ZYN CAN AESTHETIC --- */
        #zyn-can {
            margin-top: 50px;
            width: 280px;
            height: 280px;
            background-color: #ffffff; /* White Cap */
            border: 15px solid #00d2be; /* Cool Mint Teal */
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5), inset 0 5px 15px rgba(0,0,0,0.1);
            position: relative;
            cursor: pointer;
            transition: transform 0.1s;
        }

        #zyn-can:active {
            transform: scale(0.97);
        }

        #brand-text {
            color: #1a1a1a;
            font-weight: 900;
            font-size: 2rem;
            letter-spacing: 2px;
            margin: 0;
        }

        #flavor-text {
            color: #00d2be;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        #counter-display {
            color: #1a1a1a;
            font-size: 5rem;
            font-weight: bold;
            line-height: 1;
        }

        .helper-text {
            color: #888;
            font-size: 0.8rem;
            margin-top: 5px;
        }

        /* --- THE FARM (COLLECTION) --- */
        #farm-container {
            background-color: #222;
            width: 100%;
            padding: 20px;
            border-top: 2px solid #333;
            text-align: center;
        }

        h3 { margin: 0 0 15px 0; color: #00d2be; }

        #animal-grid {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .slot {
            width: 50px;
            height: 50px;
            background-color: #333;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            border: 2px dashed #555;
        }

        .slot.filled {
            background-color: #00d2be;
            border: 2px solid #fff;
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* --- ANIMATIONS & OVERLAYS --- */
        #big-reveal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        #reveal-emoji {
            font-size: 10rem;
            animation: shake 0.5s infinite;
        }

        #reveal-text {
            font-size: 2rem;
            color: #fff;
            margin-top: 20px;
            text-align: center;
        }

        .poop {
            position: absolute;
            font-size: 2rem;
            animation: drop 1s linear forwards;
        }

        @keyframes popIn {
            0% { transform: scale(0); }
            100% { transform: scale(1); }
        }

        @keyframes shake {
            0% { transform: rotate(0deg); }
            25% { transform: rotate(10deg); }
            50% { transform: rotate(0deg); }
            75% { transform: rotate(-10deg); }
            100% { transform: rotate(0deg); }
        }

        @keyframes drop {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(600px) rotate(360deg); opacity: 0; }
        }

    </style>
</head>
<body>

    <div id="zyn-can" onclick="addZyn()">
        <div id="brand-text">ZYN</div>
        <div id="flavor-text">Tracker Mint</div>
        <div id="counter-display">0</div>
        <div class="helper-text">Tap can to log</div>
    </div>

    <div id="farm-container">
        <h3>YOUR FARM (<span id="progress-text">0/6</span>)</h3>
        <div id="animal-grid">
            <div class="slot" id="slot-0"></div>
            <div class="slot" id="slot-1"></div>
            <div class="slot" id="slot-2"></div>
            <div class="slot" id="slot-3"></div>
            <div class="slot" id="slot-4"></div>
            <div class="slot" id="slot-5"></div>
        </div>
        <button onclick="resetGame()" style="margin-top:20px; background:none; border:none; color:#555; cursor:pointer;">Reset All</button>
    </div>

    <div id="big-reveal" onclick="closeReveal()">
        <div id="reveal-emoji">🦄</div>
        <div id="reveal-text">NEW FRIEND UNLOCKED!</div>
        <div style="font-size: 1rem; color:#aaa; margin-top:10px;">(Tap to continue)</div>
    </div>

    <script>
        let count = 0;
        let unlockedIndex = 0;
        
        // The Roster of characters to unlock
        const farmAnimals = ['🦄', '🦕', '🐄', '🐖', '🐓', '👽'];
        const winLimit = farmAnimals.length;

        const display = document.getElementById('counter-display');
        const progressText = document.getElementById('progress-text');
        const revealOverlay = document.getElementById('big-reveal');
        const revealEmoji = document.getElementById('reveal-emoji');
        const revealText = document.getElementById('reveal-text');

        // Check for saved data so you don't lose progress on refresh
        if(localStorage.getItem('zynCount')) {
            count = parseInt(localStorage.getItem('zynCount'));
            unlockedIndex = parseInt(localStorage.getItem('unlockedIndex'));
            updateUI();
        }

        function addZyn() {
            // If already won, don't do anything
            if (unlockedIndex >= winLimit) return;

            count++;
            saveData();
            updateUI();

            // Every 3rd pouch...
            if (count % 3 === 0) {
                unlockNewAnimal();
            }
        }

        function unlockNewAnimal() {
            if (unlockedIndex < winLimit) {
                const newAnimal = farmAnimals[unlockedIndex];
                
                // Show the big overlay
                revealEmoji.innerText = newAnimal;
                revealText.innerText = "UNLOCKED!";
                revealOverlay.style.display = 'flex';
                
                // Trigger the poop storm
                startPooping(revealEmoji);

                // Add to the grid at the bottom
                const slot = document.getElementById(`slot-${unlockedIndex}`);
                slot.innerText = newAnimal;
                slot.classList.add('filled');

                unlockedIndex++;
                saveData();
                updateUI();

                if (unlockedIndex === winLimit) {
                    revealText.innerText = "FARM COMPLETE! YOU WIN!";
                    revealText.style.color = "#00d2be";
                }
            }
        }

        function closeReveal() {
            revealOverlay.style.display = 'none';
        }

        function updateUI() {
            display.innerText = count;
            progressText.innerText = `${unlockedIndex}/${winLimit}`;
            
            // Re-fill grid if loaded from save
            for(let i=0; i<unlockedIndex; i++) {
                const slot = document.getElementById(`slot-${i}`);
                slot.innerText = farmAnimals[i];
                slot.classList.add('filled');
            }
        }

        function saveData() {
            localStorage.setItem('zynCount', count);
            localStorage.setItem('unlockedIndex', unlockedIndex);
        }

        function resetGame() {
            if(confirm("Clear your farm and start over?")) {
                count = 0;
                unlockedIndex = 0;
                localStorage.clear();
                
                // Clear UI
                display.innerText = "0";
                progressText.innerText = "0/6";
                document.querySelectorAll('.slot').forEach(slot => {
                    slot.innerText = "";
                    slot.classList.remove('filled');
                });
            }
        }

        // --- POOP LOGIC ---
        function startPooping(sourceElement) {
            let poopCount = 0;
            let pooper = setInterval(() => {
                createPoop();
                poopCount++;
                if(poopCount > 15) clearInterval(pooper);
            }, 100);
        }

        function createPoop() {
            const poop = document.createElement('div');
            poop.innerText = Math.random() > 0.5 ? '🌈' : '✨';
            poop.classList.add('poop');
            
            // Position slightly random near center
            const randomX = (Math.random() * 200) - 100; 
            const randomY = (Math.random() * 100) + 100;
            
            poop.style.left = `calc(50% + ${randomX}px)`;
            poop.style.top = `30%`; // Start near the emoji
            
            document.body.appendChild(poop);

            setTimeout(() => {
                poop.remove();
            }, 1000);
        }
    </script>
</body>
</html>
